plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id "org.jreleaser" version "1.25.0"
}

def getCurrentGitBranch() {
    def gitBranch = "Unknown branch"
    try {
        def workingDir = new File("${project.projectDir}")
        def result = 'git rev-parse --abbrev-ref HEAD'.execute(null, workingDir)
        result.waitFor()
        if (result.exitValue() == 0) {
            gitBranch = result.text.trim()
        }
    } catch (e) {
    }
    return gitBranch
}

def getUserName() {
    return System.properties['user.name']
}

group = "com.algorigo.library"
def archivesBaseName = "algorigoutil"
def versionName
if (getCurrentGitBranch() == 'master') {
    versionName = versionStr
} else {
    versionName = "${versionStr}-${getUserName()}-SNAPSHOT"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = archivesBaseName
            version = versionName
            pom {
                name = 'AlgorigoUtil'
                description = 'Algorigo Utility Library'
                url = 'https://github.com/Algorigo/AlgorigoUtils'
                artifact("$buildDir/outputs/aar/algorigoutil-release.aar")

                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'rouddy'
                        name = 'Rouddy'
                        email = 'rouddy@naver.com'
                    }
                }

                scm {
                    connection = 'scm:https://github.com/Algorigo/AlgorigoBleLibrary.git'
                    developerConnection = 'scm:git:https://github.com/Algorigo/AlgorigoBleLibrary.git'
                    url = 'https://github.com/Algorigo/AlgorigoBleLibrary'
                }
            }
        }
    }
    repositories {
        maven {
            name = "stagingDeploy"
            url = layout.buildDirectory.dir("staging-deploy").get()
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}

android {
    compileSdk = 37
    namespace 'com.algorigo.library.algorigoutil'

    defaultConfig {
        minSdkVersion 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        defaultConfig {
            consumerProguardFiles 'lib-proguard-rules.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        targetSdk 37
    }
    testOptions {
        targetSdk 37
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Joda time
    implementation 'joda-time:joda-time:2.14.3'

    // ReactiveX
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxkotlin:3.0.1'
    implementation 'com.jakewharton.rxrelay3:rxrelay:3.0.1'
}
